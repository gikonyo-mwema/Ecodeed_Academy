<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Received</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 30px auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .header { background: linear-gradient(135deg, #2d6a4f, #40916c); padding: 30px 20px; text-align: center; }
    .header h1 { color: #ffffff; margin: 0; font-size: 24px; }
    .body { padding: 30px 25px; color: #333; line-height: 1.7; }
    .body p { margin: 0 0 15px; }
    .footer { padding: 20px 25px; text-align: center; font-size: 12px; color: #999; border-top: 1px solid #eee; }
    .footer a { color: #2d6a4f; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🌿 Ecodeed</h1>
    </div>
    <div class="body">
      <p>Hi {{ name }},</p>
      <p>Thank you for reaching out to us! We've received your message and our team will get back to you within <strong>24–48 hours</strong>.</p>
      <p>In the meantime, feel free to explore our courses and resources at <a href="{{ site_url }}">Ecodeed</a>.</p>
      <p>Best regards,<br><strong>The Ecodeed Team</strong></p>
    </div>
    <div class="footer">
      <p>&copy; Ecodeed | <a href="{{ site_url }}">Visit our website</a></p>
    </div>
  </div>
</body>
</html>
