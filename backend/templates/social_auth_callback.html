<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Authentication Complete</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f9fafb;
      color: #374151;
    }
    .container { text-align: center; padding: 2rem; }
    .spinner {
      border: 3px solid #e5e7eb;
      border-top: 3px solid #10b981;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    p { color: #6b7280; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <p>Completing sign-in&hellip;</p>
    <p><small>This window will close automatically.</small></p>
  </div>

  <script>
    (function () {
      try {
        var data = JSON.parse('{{ auth_data_json|escapejs }}');
        if (window.opener) {
          window.opener.postMessage(
            { type: 'social-auth-callback', provider: 'twitter', payload: data },
            '{{ frontend_url|escapejs }}'
          );
        }
      } catch (e) {
        if (window.opener) {
          window.opener.postMessage(
            {
              type: 'social-auth-callback',
              provider: 'twitter',
              payload: { error: true, message: 'Authentication failed.' }
            },
            '{{ frontend_url|escapejs }}'
          );
        }
      }
      // Give the parent a moment to process the message, then close
      setTimeout(function () { window.close(); }, 600);
    })();
  </script>

  <noscript>
    <p>Authentication complete. Please close this window and return to the application.</p>
  </noscript>
</body>
</html>
