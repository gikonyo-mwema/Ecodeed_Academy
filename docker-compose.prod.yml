# ===========================================
# Production Docker Compose — Ecodeed Academy
# ===========================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Expects a .env file with all required variables.
# Images are pulled from Docker Hub (pre-built).
#
# SERVICES (3 containers):
# - Nginx + React SPA (port 8080)
# - Django API + Redis + Celery worker (single backend image via start.sh)
# - MySQL Database

services:
  # ── Nginx + React SPA ──
  frontend:
    image: ${DOCKERHUB_USER:?DOCKERHUB_USER is required}/ecodeed-frontend:latest
    ports:
      - "8080:80"
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped

  # ── Django API + Redis + Celery worker (via start.sh) ──
  backend:
    image: ${DOCKERHUB_USER:?DOCKERHUB_USER is required}/ecodeed-backend:latest
    # start.sh starts Redis, waits for DB, runs migrations, starts Celery, then Gunicorn
    env_file:
      - .env
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - DEBUG=False
      # Redis runs inside this container, so use localhost
      - CELERY_BROKER_URL=redis://localhost:6379/0
      - CELERY_RESULT_BACKEND=redis://localhost:6379/1
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── MySQL 8 Database ──
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    # Tune MySQL for 2 GB droplet — use ~512 MB for InnoDB
    command: >
      --innodb-buffer-pool-size=256M
      --innodb-log-file-size=64M
      --max-connections=50
      --key-buffer-size=16M
      --table-open-cache=400
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
