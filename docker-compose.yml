# Docker Compose configuration for Ecodeed Academy
# Three services: backend (Django + Redis + Celery), frontend (Vite/React), db (MySQL)
# Redis and Celery run inside the backend container via start.sh
# Environment variables are loaded from .env file

version: '3.3'

services:
  # ===========================================
  # Django Backend Service
  # Runs: Redis server + Celery worker + Gunicorn (via start.sh)
  # ===========================================
  backend:
    build: ./backend
    # start.sh handles: Redis startup, migrations, Celery worker, Gunicorn
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  # Mount backend code for live reloading
    env_file:
      - .env  # Load all env vars from root .env
    environment:
      # Override DB host/port for Docker networking
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      # Redis runs inside this container, so use localhost
      - CELERY_BROKER_URL=redis://localhost:6379/0
      - CELERY_RESULT_BACKEND=redis://localhost:6379/1
    depends_on:
      - db  # Wait for database to be ready before starting

  # ===========================================
  # MySQL Database Service
  # ===========================================
  # Redis and Celery run inside the backend container (see start.sh)
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}        # Database name from .env
      MYSQL_USER: ${MYSQL_USER}                # Database user from .env
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}        # User password from .env
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}  # Root password from .env
    volumes:
      - mysql_data:/var/lib/mysql  # Persist database data
    ports:
      - "127.0.0.1:3306:3306"  # Localhost only — never expose DB to network

  # ===========================================
  # Vite/React Frontend Service
  # ===========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev  # Use development Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app  # Mount frontend code for hot module replacement
      - frontend_node_modules:/app/node_modules  # Persist node_modules (prevents overwrite)
      - vite_cache:/app/node_modules/.vite  # Persist Vite prebundle cache
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}  # Backend API URL from .env
      - VITE_PROXY_TARGET=http://backend:8000   # Internal URL for Vite Proxy
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
      - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
      - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
      - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
      - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
      - VITE_FIREBASE_MEASUREMENT_ID=${VITE_FIREBASE_MEASUREMENT_ID}
      - VITE_PAYSTACK_PUBLIC_KEY=${VITE_PAYSTACK_PUBLIC_KEY}
      - NODE_ENV=development
    depends_on:
      - backend  # Wait for backend before starting

# ===========================================
# Named Volumes
# ===========================================
volumes:
  mysql_data:  # Persistent storage for MySQL data
  frontend_node_modules:  # Cached node_modules for faster rebuilds
  vite_cache:  # Cached Vite prebundled dependencies for faster startup
