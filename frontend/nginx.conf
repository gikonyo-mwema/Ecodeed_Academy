# Nginx configuration for Ecodeed Academy SPA
# - Serves React build (static files)
# - Proxies /api/ and /admin/ to Django backend
# - Handles SPA client-side routing

upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # ── Security hardening ──
    server_tokens off;  # Hide Nginx version from response headers

    # Content-Security-Policy — restrict what the browser is allowed to load
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.paystack.co https://www.googletagmanager.com https://apis.google.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https://res.cloudinary.com https://*.googleusercontent.com data: blob:; connect-src 'self' https://api.paystack.co https://firebaseinstallations.googleapis.com https://identitytoolkit.googleapis.com https://www.googleapis.com https://securetoken.googleapis.com; frame-src https://js.paystack.co https://accounts.google.com https://*.firebaseapp.com; object-src 'none'; base-uri 'self';" always;

    # Additional security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Max upload size (match Django's setting for image uploads)
    client_max_body_size 10M;

    # ── Gzip compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ── Proxy API requests to Django ──
    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # ── Django admin ──
    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ── Django static files (admin CSS/JS) ──
    location /static/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
    }

    # ── React static assets (JS/CSS/images with hashed names) ──
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA catch-all: serve index.html for client-side routes ──
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
