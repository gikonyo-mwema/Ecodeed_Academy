# Nginx configuration for Ecodeed Academy SPA
# - Serves React build (static files)
# - Proxies /api/ and /admin/ to Django backend
# - Handles SPA client-side routing

upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Max upload size (match Django's setting for image uploads)
    client_max_body_size 10M;

    # ── Gzip compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ── Proxy API requests to Django ──
    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # ── Django admin ──
    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ── Django static files (admin CSS/JS) ──
    location /static/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
    }

    # ── React static assets (JS/CSS/images with hashed names) ──
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA catch-all: serve index.html for client-side routes ──
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
